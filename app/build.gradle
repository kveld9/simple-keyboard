apply plugin: 'com.android.application'

def getGitVersionName() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--always'
            standardOutput = stdout
        }
        return stdout.toString().trim().replaceFirst('^v', '')
    } catch (Exception ignored) {
        return "7.4.1"
    }
}

def computeVersionCode(String versionName) {
    try {
        def clean = versionName.split('-')[0]
        def parts = clean.split('\\.')
        if (parts.length >= 3) {
            int major = parts[0].toInteger()
            int minor = parts[1].toInteger()
            int patch = parts[2].toInteger()
            return major * 10000 + minor * 100 + patch
        }
    } catch (Exception ignored) {
    }
    return 70401
}

def appVersionName = project.findProperty("versionName") ?: getGitVersionName()
def appVersionCode = project.findProperty("versionCode") ? project.property("versionCode").toInteger() : computeVersionCode(appVersionName)

android {
    defaultConfig {
        applicationId "rkr.simplekeyboard.inputmethod"
        compileSdk 37
        minSdkVersion 24
        targetSdkVersion 37
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        release {
            Properties localProps = new Properties()
            def localPropsFile = project.rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                localPropsFile.withInputStream { localProps.load(it) }
            }

            def keystorePath = System.getenv("KEYSTORE_PATH") ?: (project.findProperty("KEYSTORE_PATH") ?: (localProps.getProperty("KEYSTORE_PATH") ?: "../release.jks"))
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.findProperty("KEYSTORE_PASSWORD") ?: (localProps.getProperty("KEYSTORE_PASSWORD") ?: "FoPNaL0ACLWpEh30"))
                keyAlias System.getenv("KEY_ALIAS") ?: (project.findProperty("KEY_ALIAS") ?: (localProps.getProperty("KEY_ALIAS") ?: "simplekeyboard"))
                keyPassword System.getenv("KEY_PASSWORD") ?: (project.findProperty("KEY_PASSWORD") ?: (localProps.getProperty("KEY_PASSWORD") ?: "FoPNaL0ACLWpEh30"))
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig = true
    }
    namespace 'rkr.simplekeyboard.inputmethod'
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    testImplementation 'junit:junit:4.13.2'
}
