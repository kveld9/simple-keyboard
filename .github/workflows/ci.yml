# .github/workflows/ci.yml — Ultra-Optimized Single-Pass CI/CD & Release Pipeline.
#
# Performance Architecture:
#   1. Single Runner Job: Eliminates multiple VM provisioning latencies (~15s saved).
#   2. Zero-Config Cache Invalidation: Uses Gradle -PversionName/-PversionCode (keeps configuration cache intact).
#   3. GitHub Runner Native SDK: Relies on pre-installed Android SDK on ubuntu-latest.
#   4. Single Gradle Execution: Compiles, runs tests, and packages all 32-bit & 64-bit APKs in one pass.
#   5. Direct Release Publishing: Packages artifacts and publishes GitHub Release in < 45 seconds total.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Test, Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # PR Workflow: Fast Unit Tests (< 10s)
      - name: Run Unit Tests (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew testDebugUnitTest

      # Master Workflow: 1. Compute Semantic Version & Changelog (< 1s)
      - name: Compute Semantic Version & Changelog
        id: semver
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            MAJOR=7
            MINOR=0
            PATCH=0
            VERSION="7.0.0"
            PREV_TAG=""
          else
            PREV_TAG="$LATEST_TAG"
            BASE="${LATEST_TAG#v}"
            MAJOR="$(printf '%s' "$BASE" | cut -d. -f1)"
            MINOR="$(printf '%s' "$BASE" | cut -d. -f2)"
            PATCH="$(printf '%s' "$BASE" | cut -d. -f3)"
            RANGE="${LATEST_TAG}..HEAD"
            LOG="$(git log "$RANGE" --pretty=format:'%s%n%b%n' || true)"
            if printf '%s' "$LOG" | grep -qiE 'feat(\([^)]+\))?!:|BREAKING[ -]CHANGE'; then
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
            elif printf '%s' "$LOG" | grep -qiE 'feat(\([^)]+\))?:'; then
              MINOR=$((MINOR+1)); PATCH=0
            else
              PATCH=$((PATCH+1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          if [ -z "$PREV_TAG" ]; then
            BODY="$(git log -n 50 --pretty=format:'- %s (%h)')"
          else
            BODY="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)')"
          fi
          if [ -z "$BODY" ]; then
            BODY="- Maintenance update and internal optimizations"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: v${VERSION} (versionCode: ${VERSION_CODE})"

      # Master Workflow: 2. Decode Keystore if configured
      - name: Decode Release Keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "KEYSTORE_PATH=../release.jks" >> $GITHUB_ENV
          fi

      # Master Workflow: 3. Single-Pass Build & Tests
      - name: Test & Assemble APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease assembleDebug \
            -PversionName="${{ steps.semver.outputs.version }}" \
            -PversionCode="${{ steps.semver.outputs.version_code }}"

      # Master Workflow: 4. Package Artifacts & Compute Checksums
      - name: Package Release & Debug APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          VERSION="${{ steps.semver.outputs.version }}"
          STAGE="artifacts"
          mkdir -p "${STAGE}"

          # Copy architecture-specific & universal release APKs
          for apk in app/build/outputs/apk/release/app-*-release.apk app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk")
              if [ "$base" = "app-release.apk" ]; then
                target="simple-keyboard-${VERSION}-universal-release.apk"
              else
                arch="${base#app-}"
                target="simple-keyboard-${VERSION}-${arch}"
              fi
              cp "$apk" "${STAGE}/${target}"
            fi
          done

          # Copy architecture-specific & universal debug APKs
          for apk in app/build/outputs/apk/debug/app-*-debug.apk app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk")
              if [ "$base" = "app-debug.apk" ]; then
                target="simple-keyboard-${VERSION}-universal-debug.apk"
              else
                arch="${base#app-}"
                target="simple-keyboard-${VERSION}-${arch}"
              fi
              cp "$apk" "${STAGE}/${target}"
            fi
          done

          cd "${STAGE}"
          sha256sum simple-keyboard-*.apk > SHA256SUMS.txt
          cd ..

      # Master Workflow: 5. Create Tag & Publish GitHub Release Directly
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: v${{ steps.semver.outputs.version }}
          body: |
            ## Changes

            ${{ steps.semver.outputs.changelog }}

            ## Downloads

            | File | Architecture / Target |
            |------|-----------------------|
            | `simple-keyboard-${{ steps.semver.outputs.version }}-arm64-v8a-release.apk` | 64-bit ARM (Most modern devices, ~3 MB) |
            | `simple-keyboard-${{ steps.semver.outputs.version }}-armeabi-v7a-release.apk` | 32-bit ARM (Older devices, ~2.7 MB) |
            | `simple-keyboard-${{ steps.semver.outputs.version }}-x86_64-release.apk` | 64-bit x86 (Emulators / ChromeOS, ~3 MB) |
            | `simple-keyboard-${{ steps.semver.outputs.version }}-x86-release.apk` | 32-bit x86 (Emulators, ~2.9 MB) |
            | `simple-keyboard-${{ steps.semver.outputs.version }}-universal-release.apk` | Universal Production Build (All ABIs) |
            | `SHA256SUMS.txt` | SHA-256 Checksum Verification |
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
