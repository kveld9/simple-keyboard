apply plugin: 'com.android.application'

def getGitVersionName() {
    try {
        def text = providers.exec {
            commandLine 'git', 'describe', '--tags', '--match', 'v[0-9]*', '--always'
        }.standardOutput.asText.get()
        def res = text.trim().replaceFirst('^v', '')
        return res.isEmpty() ? "1.0.0" : res
    } catch (Exception ignored) {
        return "1.0.0"
    }
}

def computeVersionCode(String versionName) {
    try {
        def clean = versionName.split('[-+]')[0]
        def parts = clean.split('\\.')
        if (parts.length >= 3) {
            int major = parts[0].toInteger()
            int minor = parts[1].toInteger()
            int patch = parts[2].toInteger()
            return major * 10000 + minor * 100 + patch
        } else if (parts.length == 2) {
            int major = parts[0].toInteger()
            int minor = parts[1].toInteger()
            return major * 10000 + minor * 100
        } else if (parts.length == 1 && parts[0].isInteger()) {
            return parts[0].toInteger()
        }
    } catch (Exception ignored) {
    }
    return 1
}

def appVersionName = project.findProperty("versionName") ?: getGitVersionName()
def appVersionCode = project.findProperty("versionCode") ? project.property("versionCode").toInteger() : computeVersionCode(appVersionName)

android {
    defaultConfig {
        applicationId "rkr.simplekeyboard.inputmethod"
        compileSdk 37
        minSdkVersion 24
        targetSdkVersion 37
        versionCode appVersionCode
        versionName appVersionName
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        buildConfig = true
    }
    namespace 'rkr.simplekeyboard.inputmethod'
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    testImplementation 'junit:junit:4.13.2'
}
