# .github/workflows/ci.yml — unified Simple Keyboard CI/CD & Release pipeline.
#
# This is the SINGLE workflow file for the project. It runs:
#   1. checks          — Unit tests (GATE: PRs & master)
#   2. prepare-version — Computes next semver from tags + conventional commit log
#   3. build           — Compiles optimized Release & Debug APKs + generates SHA256 sums
#   4. release         — Tags v<version> and creates GitHub Release with APKs attached
#
# On PRs: `checks` runs.
# On master pushes: the full pipeline runs, creating a tagged GitHub Release with downloadable APKs.
#
# Concurrency: per-ref, cancel-in-progress=false so a master push mid-release
# doesn't get cancelled by the next push.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write   # tag + release creation
  actions: read     # cross-job artifact download

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------------
  # 1. Checks — Unit tests (GATE: nothing downstream runs if this fails).
  # -----------------------------------------------------------------------------
  checks:
    name: Unit tests & Lint validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  # -----------------------------------------------------------------------------
  # 2. Compute next semantic version from git tags + conventional commits.
  # -----------------------------------------------------------------------------
  prepare-version:
    name: Compute next version
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for `git tag` + `git log`

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            # Bootstrap at v7.0.0
            VERSION="7.0.0"
            PREV_TAG=""
          else
            PREV_TAG="$LATEST_TAG"
            BASE="${LATEST_TAG#v}"
            MAJOR="$(printf '%s' "$BASE" | cut -d. -f1)"
            MINOR="$(printf '%s' "$BASE" | cut -d. -f2)"
            PATCH="$(printf '%s' "$BASE" | cut -d. -f3)"
            RANGE="${LATEST_TAG}..HEAD"
            # Inspect every commit subject + body in range (Conventional Commits)
            LOG="$(git log "$RANGE" --pretty=format:'%s%n%b%n' || true)"
            if printf '%s' "$LOG" | grep -qiE 'feat(\([^)]+\))?!:|BREAKING[ -]CHANGE'; then
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
            elif printf '%s' "$LOG" | grep -qiE 'feat(\([^)]+\))?:'; then
              MINOR=$((MINOR+1)); PATCH=0
            else
              PATCH=$((PATCH+1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          {
            echo "version=${VERSION}"
            echo "prev_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION} (previous tag: '${PREV_TAG}')"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          PREV_TAG="${{ steps.version.outputs.prev_tag }}"
          if [ -z "$PREV_TAG" ]; then
            BODY=""
            count=0
            while IFS= read -r line; do
              BODY+="${line}"$'\n'
              count=$((count+1))
              [ "$count" -ge 100 ] && break
            done < <(git log --pretty=format:'- %s (%h)')
          else
            BODY="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)')"
          fi
          if [ -z "$BODY" ]; then
            BODY="- Maintenance update and internal optimizations"
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------------
  # 3. Build APKs (Release & Debug) and compute SHA-256 checksums.
  # -----------------------------------------------------------------------------
  build:
    name: Build APK packages
    runs-on: ubuntu-latest
    needs: [checks, prepare-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Package & Sign APK Assets
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-version.outputs.version }}"
          STAGE="artifacts"
          mkdir -p "${STAGE}"

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "${STAGE}/simple-keyboard-${VERSION}-release.apk"
          fi
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "${STAGE}/simple-keyboard-${VERSION}-debug.apk"
          fi

          cd "${STAGE}"
          sha256sum simple-keyboard-*.apk > SHA256SUMS.txt
          cd ..

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error

  # -----------------------------------------------------------------------------
  # 4. Tag & Create GitHub Release with APKs.
  # -----------------------------------------------------------------------------
  release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    needs: [checks, prepare-version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-apk
          path: release-assets

      - name: List downloaded assets
        run: |
          ls -la release-assets/

      - name: Format release body
        id: body
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-version.outputs.version }}"
          CHANGELOG="${{ needs.prepare-version.outputs.changelog }}"
          CHECKSUMS="$(cat release-assets/SHA256SUMS.txt || echo '')"
          
          {
            echo "release_body<<EOF_BODY"
            echo "## Changes"
            echo ""
            echo "${CHANGELOG}"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`simple-keyboard-${VERSION}-release.apk\` | Production build (Optimized & Minified with R8) |"
            echo "| \`simple-keyboard-${VERSION}-debug.apk\` | Debug build |"
            echo "| \`SHA256SUMS.txt\` | Checksum verification file |"
            echo ""
            echo "### SHA-256 Checksums"
            echo "\`\`\`"
            echo "${CHECKSUMS}"
            echo "\`\`\`"
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag + GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: v${{ needs.prepare-version.outputs.version }}
          body: ${{ steps.body.outputs.release_body }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
