# .github/workflows/ci.yml — High-Performance Single-Pass CI/CD & Release Pipeline.
#
# Optimized workflow:
#   1. prepare-version — Instant semver & changelog computation (< 2s, no SDK needed).
#   2. build           — Single VM, single SDK setup, single Gradle invocation:
#                        - Executes `./gradlew testDebugUnitTest assembleRelease assembleDebug`
#                        - Reuses compiled Java bytecode across tests and APK packaging without recompilation.
#                        - Creates GitHub Release with tagged APKs and SHA-256 checksums in the same job.
#
# On PRs: Only runs unit tests.
# On master pushes: Full single-pass pipeline runs in ~1 minute, tagging and publishing the release.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write   # tag + release creation
  actions: read     # workflow visibility

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------------
  # 1. Compute next semantic version from git tags + conventional commits.
  #    Lightweight job (< 2s) that runs before build without any Java/SDK overhead.
  # -----------------------------------------------------------------------------
  prepare-version:
    name: Compute next version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for `git tag` + `git log`

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            VERSION="7.0.0"
            PREV_TAG=""
          else
            PREV_TAG="$LATEST_TAG"
            BASE="${LATEST_TAG#v}"
            MAJOR="$(printf '%s' "$BASE" | cut -d. -f1)"
            MINOR="$(printf '%s' "$BASE" | cut -d. -f2)"
            PATCH="$(printf '%s' "$BASE" | cut -d. -f3)"
            RANGE="${LATEST_TAG}..HEAD"
            LOG="$(git log "$RANGE" --pretty=format:'%s%n%b%n' || true)"
            if printf '%s' "$LOG" | grep -qiE 'feat(\([^)]+\))?!:|BREAKING[ -]CHANGE'; then
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
            elif printf '%s' "$LOG" | grep -qiE 'feat(\([^)]+\))?:'; then
              MINOR=$((MINOR+1)); PATCH=0
            else
              PATCH=$((PATCH+1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          {
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "prev_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION} (versionCode: ${VERSION_CODE}, previous tag: '${PREV_TAG}')"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          PREV_TAG="${{ steps.version.outputs.prev_tag }}"
          if [ -z "$PREV_TAG" ]; then
            BODY=""
            count=0
            while IFS= read -r line; do
              BODY+="${line}"$'\n'
              count=$((count+1))
              [ "$count" -ge 100 ] && break
            done < <(git log --pretty=format:'- %s (%h)')
          else
            BODY="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)')"
          fi
          if [ -z "$BODY" ]; then
            BODY="- Maintenance update and internal optimizations"
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------------
  # 2. Single-Pass Build & Test (1 single setup, 1 single Gradle invocation)
  # -----------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: prepare-version
    if: always() && (needs.prepare-version.result == 'success' || needs.prepare-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # On PRs: Run only unit tests
      - name: Run Unit Tests (PRs)
        if: github.event_name == 'pull_request'
        run: ./gradlew testDebugUnitTest

      # On Master: Burn computed semantic version into app/build.gradle
      - name: Burn Version into Build Files (Master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-version.outputs.version }}"
          VERSION_CODE="${{ needs.prepare-version.outputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="70000"; fi
          echo "Burning version ${VERSION} (${VERSION_CODE}) into app/build.gradle"
          sed -i "s/def appVersionName = .*/def appVersionName = \"${VERSION}\"/" app/build.gradle
          sed -i "s/def appVersionCode = .*/def appVersionCode = ${VERSION_CODE}/" app/build.gradle

      # On Master: Run unit tests AND assemble APKs in a SINGLE Gradle invocation with explicit version properties
      - name: Test & Build Release & Debug APKs (Master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: ./gradlew testDebugUnitTest assembleRelease assembleDebug -PversionName="${{ needs.prepare-version.outputs.version }}" -PversionCode="${{ needs.prepare-version.outputs.version_code }}"

      # Package artifacts with semantic versioning
      - name: Package APK Assets & Checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-version.outputs.version }}"
          STAGE="artifacts"
          mkdir -p "${STAGE}"

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "${STAGE}/simple-keyboard-${VERSION}-release.apk"
          fi
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "${STAGE}/simple-keyboard-${VERSION}-debug.apk"
          fi

          cd "${STAGE}"
          sha256sum simple-keyboard-*.apk > SHA256SUMS.txt
          cd ..

      # Tag and create GitHub Release directly from the same machine (zero artifact transfer latency)
      - name: Create tag + GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: v${{ needs.prepare-version.outputs.version }}
          body: |
            ## Changes

            ${{ needs.prepare-version.outputs.changelog }}

            ## Downloads

            | File | Description |
            |------|-------------|
            | `simple-keyboard-${{ needs.prepare-version.outputs.version }}-release.apk` | Production build (Optimized & Minified with R8) |
            | `simple-keyboard-${{ needs.prepare-version.outputs.version }}-debug.apk` | Debug build |
            | `SHA256SUMS.txt` | Checksum verification file |
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
